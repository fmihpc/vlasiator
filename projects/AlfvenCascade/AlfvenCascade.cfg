project = AlfvenCascade
ParticlePopulations = proton
propagate_field = 1
propagate_vlasov_acceleration = 1
propagate_vlasov_translation = 1
dynamic_timestep = 1

[io]
diagnostic_write_interval = 1
write_initial_state = 0

system_write_t_interval = 5
system_write_file_name = bulk
system_write_distribution_stride = 0
system_write_distribution_xline_stride = 0
system_write_distribution_yline_stride = 0
system_write_distribution_zline_stride = 0

[AMR]
max_spatial_level = 0

[proton_properties]
mass = 1
mass_units = PROTON
charge = 1

[proton_vspace]
vx_min = -3e6
vx_max = +3e6
vy_min = -3e6
vy_max = +3e6
vz_min = -3e6
vz_max = +3e6
vx_length = 50
vy_length = 50
vz_length = 50

[proton_sparse]
minValue = 1.0e-15

[gridbuilder]
x_length = 300
y_length = 1
z_length = 1
x_min = -150e6
x_max = 150e6
y_min = 0.0
y_max = 100e4
z_min = 0.0
z_max = 100e4
t_max = 50

[bailout]
min_dt = 5e-5
velocity_space_wall_block_margin = 1

[variables]
output = populations_vg_rho
output = populations_vg_v
output = fg_e
output = fg_b
output = vg_b_vol
output = vg_e_vol
output = vg_rank
output = populations_vg_blocks
output = vg_v
diagnostic = populations_vg_blocks

[fieldsolver]
ohmHallTerm = 1
minCFL = 0.4
maxCFL = 0.45
maxSubcycles = 40
ohmGradPeTerm = 0

[vlasovsolver]
minCFL = 0.8
maxCFL = 0.99
maxSlAccelerationSubcycles = 2

[boundaries]
periodic_x = yes
periodic_y = yes
periodic_z = yes

[AlfvenCascade]
