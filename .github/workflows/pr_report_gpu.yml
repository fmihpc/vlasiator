name: ReportGPU
on:
  workflow_run:
    workflows: [Github-CI]
    types: [completed]

permissions:
  checks: write

jobs:
  testpackage_report_turso_v100:
    runs-on: ubuntu-latest
    steps:
      - name: download testpackage output
        id: download
        # Note we are downloading an artifact from a
        # *different* workflow here.
        uses: ursg/action-download-artifact@5e780fc7bbd0cac69fc73271ed86edf5dcb72d67 # v2
        with:
          name: testpackage-output-turso-v100_GNU_MPICH
          workflow: ${{ github.event.workflow.id }}
          run_id: ${{ github.event.workflow_run.id }}
          # No artifact when the testpackage did not run, e.g. for docs-only changes.
          if_no_artifact_found: warn
      - name: unpack and process pr output
        id: unpack
        if: steps.download.outputs.found_artifact == 'true'
        run: |
          tar -xzvf testpackage-output-turso-v100_GNU_MPICH.tar.gz
          cat testpackage_output_variables.txt >> $GITHUB_OUTPUT
          # Limit Report filesize, as github only allows 64k PR reports
          truncate --size='<60K' testpackage_check_description.txt
      - name: Generate PR check report
        uses: ursg/checks-action@9a0aa980f3bfa365788965ed309f7f0090cfcf29 # v1.6.0
        if: always() && steps.download.outputs.found_artifact == 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sha: ${{github.event.workflow_run.head_sha}}
          name: Testpackage turso-V100 result
          conclusion: ${{ steps.unpack.outputs.conclusion }}
          output: |
            {"title": "Testpackage turso-V100 result", "summary":"${{ steps.unpack.outputs.summary }}"}
          output_text_description_file: testpackage_check_description.txt
