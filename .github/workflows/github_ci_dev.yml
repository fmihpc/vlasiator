name: TURSO_CI

on:
  # Dispatch this workflow whenever master or dev get a PR or commit
  push:
    branches : ["dev","master"]
  pull_request:
    branches: ["dev","master"]
  # ... or when the workflow is started manually
  workflow_dispatch:

concurrency:
   group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
   cancel-in-progress: true

jobs:
  #Dummy job to be able to reuse the steps later
  _definitions:
    strategy: &strategy
      fail-fast: false
      matrix: 
        include:
          - runner: hile
            arch: hile_gpu
            compile_tp: true
          - runner: hile
            arch: hile_cpu
            compile_tp: true
          - runner: carrington
            arch: ukko_dgx
            compile_tp: true
          - runner: carrington
            arch: carrington_gcc_openmpi
            compile_tp: true
          - runner: risc-v
            arch: pioneer
            compile_tp: false
    runs-on: ubuntu-latest
    if: false
    steps:
    - &checksrc
      name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: true
    - &cleanup
      name: Clean workspace
      run: |
        export VLASIATOR_ARCH=${{ matrix.arch }}
        ./.github/workflows/slurm_run.sh "CLEANUP"
    - &binaryVisible
      name: Make sure the output binary is visible in lustre
      uses: nick-fields/retry@v3
      with:
        timeout_seconds: 15
        max_attempts: 3
        retry_on: error
        command: ls vlasiator
    - &ifCompileTP
      name: Check whether to run this step 
      if: ${{ matrix.compile_tp }}
      run: echo "Running"

  
  get_git_diff:
    runs-on: ubuntu-latest
    outputs:
       RUN_TP: ${{ steps.gitdiff.outputs.RUN_TP }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get git diff
        id: gitdiff
        run: |
          cd $GITHUB_WORKSPACE
          #chmod +x ./.github/workflows/CI_git_diff.sh
          echo Comparing PR branch against ${{ github.base_ref }}
          if [[ $(./.github/workflows/CI_git_diff.sh ${{ github.base_ref }} ) = "no_test" ]]; then
            echo "RUN_TP=False" >> $GITHUB_OUTPUT
            echo "Not running testpackage"
            exit 0
          fi
          echo "Running testpackage"
  get_git_diff_check:
    runs-on: ubuntu-latest
    needs: get_git_diff
    if: ${{ needs.get_git_diff.outputs.RUN_TP != 'False' }}
    steps:
      - name: Checking whether to run tests
        run: |
          echo "Running testpackage"

  build_libraries_github:
    # Build libraries for the current version of the docker image
    # (to be used in any subsequent compilation and run jobs on said image)

    runs-on: ubuntu-latest
    container: ursg/vlasiator_ci:20250909_1

    steps:
      - uses: lukka/get-cmake@latest
      - *checksrc
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y g++ build-essential cmake make libopenmpi-dev openmpi-bin libboost-program-options-dev zstd
      - name: Run library build script
        run: ./fetch_and_build_libraries.sh
      - name: Build libraries tar
        run: tar --zstd -cf libraries-docker.tar.zstd libraries-docker/
      - name: Upload libraries as artifact
        uses: actions/upload-artifact@v4
        with:
          name: libraries-docker
          path: libraries-docker.tar.zstd
          retention-days: 5
          if-no-files-found: error
  #
  # build_libraries:
  #   #continue-on-error: true
  #
  #   strategy: *strategy
  #
  #   runs-on: ${{ matrix.runner }}
  #   steps:
  #     - *checksrc 
  #     - *cleanup
  #     - name: Run library build script ${{ matrix.arch }}
  #       run: | 
  #         export VLASIATOR_ARCH=${{ matrix.arch }}
  #         ./.github/workflows/slurm_run.sh "BUILD_LIBS"
  #     - name: Build libraries tar
  #       run: tar -zcf libraries-${{ matrix.arch }}.tar.gz libraries-${{ matrix.arch }}/
  #     - name: Upload libraries as artifact
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: libraries-${{ matrix.arch }}
  #         path: libraries-${{ matrix.arch }}.tar.gz
  #         retention-days: 5
  #         if-no-files-found: error


  build_TP:
    # Build Vlasiator with testpackage flags, on the carrington cluster
    # (for subsequent running of the integration test package)
    runs-on: carrington
    strategy: *strategy
        
    steps:
    - *ifCompileTP
    - *checksrc 
    - *cleanup
    - name: Make clean
      run: VLASIATOR_ARCH=${{ matrix.arch }} make clean
    - name: Run library build script ${{ matrix.arch }}
      run: | 
        export VLASIATOR_ARCH=${{ matrix.arch }}
        ./.github/workflows/slurm_run.sh "BUILD_LIBS"
    - uses: ursg/gcc-problem-matcher@master
    - name: Compile vlasiator (Testpackage build)
      run: |
        export VLASIATOR_ARCH=${{ matrix.arch }}
        ./.github/workflows/slurm_run.sh "COMPILE_TP"
    - *binaryVisible
    - name: Upload testpackage binary
      uses: actions/upload-artifact@v4
      with:
        name: vlasiator-testpackage
        path: vlasiator
        if-no-files-found: error


  build_prod_debug:
    # Build Vlasiator with production flags and all the debug flags enabled, on the HILE cluster using
    # its AMD gpus
    
    strategy: *strategy

    runs-on: ${{ matrix.runner }}
    steps:
      - *checksrc
      - *cleanup
      - name: Make clean
        run: VLASIATOR_ARCH=${{ matrix.arch }} make clean
      - uses: ursg/gcc-problem-matcher@master
      - name: Run library build script ${{ matrix.arch }}
        run: | 
          export VLASIATOR_ARCH=${{ matrix.arch }}
          ./.github/workflows/slurm_run.sh "BUILD_LIBS"
      - name: Unpack libraries
        run: tar -zxf libraries-hile_gpu.tar.gz

      - name: Compile vlasiator 
        run: |
          export VLASIATOR_ARCH=${{ matrix.arch }}
          ./.github/workflows/slurm_run.sh "COMPILE_PROD"

      - *binaryVisible
      - name: Upload testpackage binary
        uses: actions/upload-artifact@v4
        with:
          name: vlasiator-prod-debug-${{ matrix.arch }}
          path: vlasiator
          if-no-files-found: error

  build_tools:
      # Build vlsvdiff and vlsvextract for testpackage use
      # NOTE is lacking libraries at the moment
      strategy: *strategy

      runs-on: ${{ matrix.runner }}

      steps:
        - *checksrc
        - *cleanup
        - name: Make clean
          run: VLASIATOR_ARCH=${{ matrix.arch }} make clean
        - name: Run library build script ${{ matrix.arch }}
          run: | 
            export VLASIATOR_ARCH=${{ matrix.arch }}
            ./.github/workflows/slurm_run.sh "BUILD_LIBS"
        - uses: ursg/gcc-problem-matcher@master
        - name: Compile tools 
          run: |
            export VLASIATOR_ARCH=${{ matrix.arch }}
            ./.github/workflows/slurm_run.sh "BUILD_TOOLS"
        - name: Upload tools binaries
          uses: actions/upload-artifact@v4
          with:
            name: vlasiator-tools-${{ matrix.arch }}
            path: |
              vlsvextract_DP
              vlsvdiff_DP
              fluxfunction
            if-no-files-found: error

  run_TP:
      # Build vlsvdiff and vlsvextract for testpackage use
      # NOTE is lacking libraries at the moment
      strategy: *strategy

      runs-on: ${{ matrix.runner }}
      
      needs: [build_TP,build_tools]

      steps:
        - *ifCompileTP
        - *checksrc
        - *cleanup
        - name: Make clean
          run: VLASIATOR_ARCH=${{ matrix.arch }} make clean
        - uses: ursg/gcc-problem-matcher@master


