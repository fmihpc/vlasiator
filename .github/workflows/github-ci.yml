name: Github-CI

on:
  # Dispatch this workflow whenever master or dev get a PR or commit
  push:
    branches : ["dev","master"]
  pull_request:
    branches: ["dev","master"]
  schedule:
    - cron: '0 0 * * TUE'
      timezone: "Europe/Helsinki"
  # ... or when the workflow is started manually
  workflow_dispatch:

# Read-only suffices: artifact upload/download uses the runtime token, not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
   group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
   cancel-in-progress: true

jobs:

  get_git_diff:
    runs-on: ubuntu-latest
    outputs:
       RUN_TP: ${{ steps.gitdiff.outputs.RUN_TP }}
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get git diff and determine whether to run testpackage
        id: gitdiff
        run: |
          cd $GITHUB_WORKSPACE
          #chmod +x ./.github/workflows/CI_git_diff.sh
          echo Comparing PR branch against ${GITHUB_BASE_REF}
          if [[ -n "$GITHUB_BASE_REF" && $(./.github/workflows/CI_git_diff.sh "$GITHUB_BASE_REF") == "no_test" ]]; then
            echo "RUN_TP=False" >> $GITHUB_OUTPUT
            echo "Not running testpackage"
            exit 0
          fi
          echo "Running testpackage"


  testpackage:
    strategy: &strategy
      fail-fast: false
      matrix:
        #Each (arch, name) pair must be unique: together they name the uploaded artifacts
        #At most one run_tp: true entry per arch: the testpackage output artifact is named by arch alone
        #tp_quick: true limits pushes and PRs to the quick test subset; scheduled and manual runs use all tests
        include:
          - name: prod
            runner: hile       #Tag of the github runner to run on

            arch: hile_gpu     #Architecture flag

            compile_tp: false  #Whether to compile with testpackage flag, can also add specific compile flags, see compile_flags_tp in slurm_run.sh
                               #otherwise will use prod flags

            run_tp: false      #Whether to run the testpackage, note that the github ci
                               #testpackage has to be implemented for that platform

            debug: false       #compile with debug flags, see compile_flags_prod and compile_flags_tp in slurm_run.sh

          - name: testpackage run
            runner: hile
            arch: hile_cpu
            compile_tp: true
            run_tp: true
            debug: false

          - name: prod
            runner: ukko
            arch: turso-v100_GNU_MPICH
            compile_tp: false
            run_tp: false
            debug: false

          - name: prod_debug
            runner: ukko
            arch: turso-v100_GNU_MPICH
            compile_tp: false
            run_tp: false
            debug: true

          - name: testpackage_debug
            runner: ukko
            arch: turso-v100_GNU_MPICH
            compile_tp: true
            run_tp: true
            tp_quick: true # all tests take about 4 h in this debug build
            debug: true

          - name: testpackage run
            runner: carrington
            arch: turso-amd_GNU_MPICH
            compile_tp: true
            run_tp: true
            debug: false

          - name: prod_debug
            runner: carrington
            arch: turso-amd_GNU_MPICH
            compile_tp: false
            run_tp: false
            debug: true

          - name: prod
            runner: risc-v
            arch: pioneer
            compile_tp: false
            run_tp: false
            debug: false

          - name: lumi-c
            runner: lumi
            arch: lumi_2503
            compile_tp: true
            run_tp: true
            debug: true

          - name: lumi-g
            runner: lumi
            arch: lumi_2503_gpu
            compile_tp: false
            run_tp: false
            debug: false

    runs-on: ${{ matrix.runner }}
    needs: get_git_diff
    if: github.repository_owner == 'fmihpc'
    env:
      VLASIATOR_ARCH: ${{ matrix.arch }}
      TP_QUICK: ${{ matrix.tp_quick == true && (github.event_name == 'push' || github.event_name == 'pull_request') }}
    steps:
      #The & tags can be reused in other job steps with `- *tagname` scroll down for examples on how *checkoutSource has been used
    - &checkoutSource
      name: Checkout source
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false
    - &cleanWorkspace
      name: Clean workspace
      run: |
        ./.github/workflows/slurm_run.sh "CLEANUP"
        git reset --hard HEAD #cleanup nukes testpackage folder, resetting here so things work again
    - &makeClean
      name: Make clean
      run: make clean
    - name: Register GCC problem matcher
      run: echo "::add-matcher::$GITHUB_WORKSPACE/.github/gcc-problem-matcher.json"
    - &buildLibs
      name: Run library build script ${{ matrix.arch }}
      run: |
        ./.github/workflows/slurm_run.sh "BUILD_LIBS"
    - &packageLibraries
      name: Packaging libraries
      continue-on-error: true
      run: tar -zcf libraries-${{ matrix.arch }}.tar.gz libraries-${{ matrix.arch }}/
    - &compileTP
      name: Compile vlasiator (Testpackage build)
      if: ${{ matrix.compile_tp }}
      background: true
      run: |
        ./.github/workflows/slurm_run.sh "COMPILE_TP" ${{ matrix.debug }}
    - &compileProd
      name: Compile prod
      if: ${{ ! matrix.compile_tp }}
      background: true
      run: |
        ./.github/workflows/slurm_run.sh "COMPILE_PROD" ${{ matrix.debug }}
    - &compileTools
      name: Compile tools
      background: true
      run: |
        ./.github/workflows/slurm_run.sh "BUILD_TOOLS"
    - name: Wait for tools and tp to compile
      wait-all: true
    - &checkVlasiatorBinaryVisibility
      name: Make sure the output binary is visible in lustre
      uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
      with:
        timeout_seconds: 15
        max_attempts: 3
        retry_on: error
        command: ls vlasiator
    - &runTP
      name: Run TP
      id: run
      if: ${{ matrix.run_tp && matrix.compile_tp && needs.get_git_diff.outputs.RUN_TP != 'False' }}
      run: |
        ./.github/workflows/slurm_run.sh "RUN_TP"
    - name: Scancel dangling job upon cancellation
      if: cancelled()
      run: |
        # Try canceling with job name
        scancel -n "CI_TP_${{ steps.run.outputs.TP_PID }}" --user $(whoami)
        # Try accessing the job id echoed by the job script.
        scancel ${{ steps.run.outputs.SLURM_JOB_ID }}
    - &uploadTestpackageOutput
      name: Upload testpackage output
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      # Fixed per-arch name: pr_report*.yml download it by name.
      if: ${{ always() && matrix.run_tp }}
      with:
        name: testpackage-output-${{ matrix.arch }}
        path: testpackage-output-${{ matrix.arch }}.tar.gz
    - name: Upload full testpackage logs
      # The step summary keeps only the end of each test's log.
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: ${{ always() && matrix.run_tp }}
      with:
        name: testpackage-logs-${{ matrix.arch }}
        path: testpackage_logs/
        retention-days: 14
    - &fluxTest
      name: Run fluxfunction test
      # Needs Magnetosphere_small and Magnetosphere_polar_small, which the quick subset leaves out.
      if: ${{ matrix.run_tp && needs.get_git_diff.outputs.RUN_TP != 'False' && env.TP_QUICK != 'true' }}
      run: |
        ./.github/workflows/slurm_run.sh "FLUXTEST"
    - &uploadTools
      name: Upload tools binaries
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: vlasiator-tools-${{ matrix.arch }}-${{ matrix.name }}
        path: |
          vlsvextract_DP
          vlsvdiff_DP
          fluxfunction
        if-no-files-found: error
    - &uploadTP
      name: Upload testpackage binary
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: vlasiator-testpackage-${{ matrix.arch }}-${{ matrix.name }}
        path: vlasiator
        if-no-files-found: error
    - &uploadLibs
      name: Upload libraries as artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: libraries-${{ matrix.arch }}-${{ matrix.name }}
        path: libraries-${{ matrix.arch }}.tar.gz
        retention-days: 5
        if-no-files-found: error

  build_libraries_github:
    # Build libraries for the current version of the docker image
    # (to be used in any subsequent compilation and run jobs on said image)

    runs-on: ubuntu-latest
    container: ursg/vlasiator_ci:20260910_1

    steps:
      - uses: lukka/get-cmake@a1a8216777d3cbbf5602c73b9ddd3e98257ecdc4 # v4.5.1
      - *checkoutSource
      - &githubLibs
        name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y g++ build-essential cmake make libopenmpi-dev openmpi-bin zstd
      - name: Run library build script
        run: ./fetch_and_build_libraries.sh
      - name: Build libraries tar
        run: tar --zstd -cf libraries-docker.tar.zstd libraries-docker/
      - name: Upload libraries as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: libraries-docker
          path: libraries-docker.tar.zstd
          retention-days: 5
          if-no-files-found: error

  build_arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - *checkoutSource
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ build-essential cmake make libopenmpi-dev openmpi-bin zstd
      - name: Run library build script
        run: |
          . ./fetch_and_build_libraries.sh arm64
      - name: Build libraries tar
        run: tar --zstd -cf libraries-arm64.tar.zstd libraries-arm64
      - name: Upload libraries as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: libraries-arm64
          path: libraries-arm64.tar.zstd
          retention-days: 5
          if-no-files-found: error
      - name: Make clean
        run: VLASIATOR_ARCH=github_actions_arm64 make clean
      - name: Compile vlasiator (Release build)
        run: |
          VLASIATOR_ARCH=github_actions_arm64 make -j 4

  build_github:
    strategy:
      fail-fast: false
      matrix:
        compile_flags: ["prod","prod_debug","ord1_time","ord1_space"]
    runs-on: ubuntu-latest
    container: ursg/vlasiator_ci:20260910_1
    needs: build_libraries_github
    env:
      VLASIATOR_ARCH: github_actions
    steps:
    - *checkoutSource
    - name: Fetch submodule libraries
      run: ./fetch_submodules.sh
    - name: Download libraries
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
      with:
        name: libraries-docker
    - name: Unpack libraries
      run: tar --zstd -xf libraries-docker.tar.zstd
    - name: Register GCC problem matcher
      run: echo "::add-matcher::$GITHUB_WORKSPACE/.github/gcc-problem-matcher.json"

    - name: Compile vlasiator (Release build)
      shell: bash
      run: |
        make clean
        compile_flag=${{ matrix.compile_flags }}
        if [[ "$compile_flag" == "prod" ]]; then
          make -j 3
        elif [[ "$compile_flag" == "ord1_time" ]]; then
          COMPFLAGS="-DFS_1ST_ORDER_TIME" make -j 3
        elif [[ "$compile_flag" == "ord1_space" ]]; then
          COMPFLAGS="-DFS_1ST_ORDER_SPACE" make -j 3
        elif [[ "$compile_flag" == "prod_debug" ]]; then
          COMPFLAGS="-DDEBUG_VLASIATOR -DDEBUG_SOLVERS -DDEBUG_IONOSPHERE -DDEBUG_SPATIAL_CELL -DDEBUG_VMESH -DDEBUG_VBC -DDEBUG_ACC" make -j 3
        else
          echo "Unknown compile_flags entry: $compile_flag"
          exit 1
        fi

    - name: Upload release binary
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: vlasiator-${{ matrix.compile_flags }}
        path: vlasiator
        if-no-files-found: error

  ionosphereTests_github:
    # Build IonosphereSolverTests miniApp
    runs-on: ubuntu-latest
    container: ursg/vlasiator_ci:20260910_1
    needs: build_libraries_github
    steps:
    - *checkoutSource
    - name: Fetch submodule libraries
      run: ./fetch_submodules.sh
    - name: Download libraries
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
      with:
        name: libraries-docker
    - name: Unpack libraries
      run: tar --zstd -xf libraries-docker.tar.zstd
    - name: Compile ionosphereSolverTests
      run: |
        cd mini-apps/ionosphereSolverTests/
        VLASIATOR_ARCH=github_actions make -j 3
    - name: Upload ionosphereTest binaries
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ionosphereTests
        path: |
          mini-apps/ionosphereSolverTests/main
          mini-apps/ionosphereSolverTests/differentialFlux
          mini-apps/ionosphereSolverTests/sigmaProfiles
        if-no-files-found: error
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
    - name: Install uv
      uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
    - name: install Gnuplot
      run: |
        apt update
        apt -y install gnuplot-nox
    - name: checkout & install Analysator
      run: |
        cd mini-apps/ionosphereSolverTests/
        git clone https://github.com/fmihpc/analysator
        export TMPDIR=$RUNNER_TEMP
        uv venv CI_env
        . CI_env/bin/activate
        uv pip install --editable analysator
    - name: Run LFMtest
      run: |
        chmod +x $GITHUB_WORKSPACE/mini-apps/ionosphereSolverTests/main
        cd mini-apps/ionosphereSolverTests/
        OMP_NUM_THREADS=1 ./main -N 2000 -r 40 90 -r 50 90 -r 60 80 -sigma 10 -fac merkin2010 -gaugeFix equator45 -o LFMtest.vlsv -maxIter 10000
        export TMPDIR=$RUNNER_TEMP
        . CI_env/bin/activate
        export PTNONINTERACTIVE=1
        python3 ./lfmformat.py LFMtest.vlsv > lfmtest.dat
        ./plot_LFMtest.gp
    - name: Run atmospheric profile test
      run: |
        chmod +x $GITHUB_WORKSPACE/mini-apps/ionosphereSolverTests/sigmaProfiles
        cd mini-apps/ionosphereSolverTests/
        ./sigmaProfiles 1e6 1.16046e7 > atmosphere.dat
        ./sigmaProfiles 1e6 1.16046e8 > atmosphere10.dat
        ./sigmaProfiles 1e6 1.16046e9 > atmosphere100.dat
        ./plotAtmosphere.gp
    - name: Upload ionosphereTest result images
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ionosphereTestResults
        path: |
          mini-apps/ionosphereSolverTests/LFMtest.png
          mini-apps/ionosphereSolverTests/atmosphere.png
        if-no-files-found: error

  check_cfg_files:
    runs-on: ubuntu-latest
    container: ursg/vlasiator_ci:20260910_1
    needs: build_github
    steps:
    - name: Checkout source
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        submodules: false
        persist-credentials: false
    - name: Download libraries
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
      with:
        name: libraries-docker
    - name: Unpack libraries
      run: tar --zstd -xf libraries-docker.tar.zstd
    - name: Download release binary
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
      with:
        name: vlasiator-prod
    - name: Ensure the binary is executable
      run: |
        chmod +x $GITHUB_WORKSPACE/vlasiator
    - name: Check cfg files in projects/
      env:
          CFGFOLDER: projects
      run: &checkCfg |
        retval=0
        set +e
        for cfg in `find $CFGFOLDER -name \*.cfg`; do
          echo -n "Testing cfg file $cfg... "
          PRINT_ONLY_ERRORS=true LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$GITHUB_WORKSPACE/libraries-docker/lib tools/check_vlasiator_cfg.sh $GITHUB_WORKSPACE/vlasiator $cfg 2>&1 > cfgtest.out
          if [ $? != 0 ]; then
            if `echo $cfg | grep -sq unsupported`; then
              echo "failed (unsurprising)"
            else
              echo "FAILED:";
              cat cfgtest.out;
              retval=127
            fi
          else
            echo "ok."
          fi;
        done
        exit $retval
    - name: Check cfg files in samples/
      env:
          CFGFOLDER: samples
      run: *checkCfg
    - name: Check cfg files in testpackage/
      env:
          CFGFOLDER: testpackage
      run: *checkCfg
